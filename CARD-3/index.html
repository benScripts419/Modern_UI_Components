<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Card-2</title>
</head>
<body>
    <div class="bg-black h-screen">
        <div class="flex flex-col items-center py-10">
            <h1 class="text-5xl text-white/80">Which is Better</h1>
            <div class="grid grid-cols-2 max-w-3xl mx-auto gap-8">
                <div class="flex flex-col items-center justify-center">
                    <img src="images/like1.svg" alt="" class="py-4" />
                    <div class="bg-white w-80 h-auto rounded-3xl relative">
                        <img src="images/card2-bg.jpg" alt="" class="object-cover aspect-2/3 rounded-3xl p-2 bg-white" />
    
                        <div class="absolute top-4 right-4">
                            <div class="flex flex-col">
                                <h3 class="text-white text-sm font-semibold">France</h3>
                                <div class="text-sm text-[#f1d2aa]">Paris, Lyon</div>
                            </div>
                        </div>
                        <div class="absolute top-104 left-5">
                            <div
                                class="flex flex-row items-center justify-between w-70 gap-4 px-2 py-1 bg-gray-300 border border-white/50 shadow-xl rounded-lg">
                                <div class="flex flex-col">
                        
                                    <h2 class="text-black text-sm font-semibold">
                                        Mr. Addo
                                    </h2>
                                    <p class="text-gray-500 text-xs">php Developer</p>
                                </div>
                                <button class="bg-black text-white rounded-md px-4 py-1">
                                    Follow
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex flex-col items-center justify-center py-4">
                    <img src="images/like2.svg" alt="" class="py-4" />
                    <div class="bg-white w-80 h-auto rounded-3xl relative">
                        <img src="images/card2-bg.jpg" alt="" class="object-cover aspect-video rounded-3xl p-2 bg-white" />
                        <div class="absolute bottom-7 left-5">
                            <div class="bg-black h-15 rounded-lg border border-white/20">
                                <div class="flex justify-center py-0.5">
                                    <h3 class="text-white text-sm">
                                        France <span class="text-[#d0a87a]">Paris, Lyon</span>
                                    </h3>
                                </div>
                                <div
                                    class="flex flex-row items-center justify-between w-70 gap-4 px-2 py-1 bg-gray-300 rounded-lg">
                                    <div class="flex flex-col">
                                    
                                        <h2 class="text-black text-sm font-semibold">
                                            Mr. Addo
                                        </h2>
                                        <p class="text-gray-500 text-xs">php Developer</p>
                                    </div>
                                    <button class="bg-black text-white rounded-md px-4 py-1">
                                        Follow
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
